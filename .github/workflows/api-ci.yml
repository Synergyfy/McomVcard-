name: API CI

on:
  push:
    branches: [main, master, logic]
  pull_request:
    branches: [main, master, logic]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mcomvcard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@9.15.4 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        working-directory: apps/api
        run: pnpm exec tsc --noEmit

      - name: Build
        working-directory: apps/api
        run: pnpm run build

      - name: Run unit tests
        working-directory: apps/api
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-key-for-ci
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASS: postgres
          DB_NAME: mcomvcard_test
        run: pnpm run test

      - name: Run migrations
        working-directory: apps/api
        env:
          NODE_ENV: production
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASS: postgres
          DB_NAME: mcomvcard_test
        run: pnpm run migration:run
